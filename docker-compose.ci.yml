# Docker Compose override for CI/CD environments
# - Uses production build targets (code baked into images)
# - Production targets don't rely on volume mounts for code
# - Services will use code from COPY commands in Dockerfile

services:
  # Override club-service to use production target
  club-service:
    build:
      target: production
    
  # Override event-service to use production target  
  event-service:
    build:
      target: production
