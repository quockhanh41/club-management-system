services:
  # E2E test runner service
  # Builds image with code and runs Playwright tests on same network as services
  e2e-runner:
    build:
      context: .
      dockerfile: Dockerfile.e2e
    networks:
      - club_network
    environment:
      - CI=true
      - BASE_URL=http://frontend:3000
      - API_GATEWAY_URL=http://kong:8000
      - API_GATEWAY_SECRET=test-secret-e2e
    depends_on:
      frontend:
        condition: service_healthy
      kong:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      club-service:
        condition: service_healthy
      event-service:
        condition: service_healthy

networks:
  club_network:
    external: false
